<!-- ==================== MODAL ADD / EDIT PRODUCT ==================== -->
  <div id="productModal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-100 pb-3">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-indigo-100 text-indigo-600 flex items-center justify-center">
            <i data-lucide="package-plus" class="w-4 h-4" id="modalIcon"></i>
          </div>
          <h3 class="font-bold text-slate-900 text-base" id="modalProductTitle">Thêm Sản Phẩm Mới</h3>
        </div>
        <button onclick="closeProductModal()" class="text-slate-400 hover:text-slate-700 cursor-pointer">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="productForm" onsubmit="handleSaveProduct(event)" class="space-y-3.5 text-xs">
        <input type="hidden" id="modalProductMode" value="add" />
        <input type="hidden" id="modalOriginalBarcode" value="" />
        <input type="hidden" id="modalOriginalProductCode" value="" />

        <div>
          <label class="block font-medium text-slate-700 mb-1">Mã Barcode (13 số hoặc mã định danh) *</label>
          <input type="text" id="modalBarcode" required placeholder="Ví dụ: 6977304933225" 
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white font-mono font-semibold focus:ring-1 focus:ring-indigo-500">
          <p class="text-[11px] text-slate-400 mt-0.5">Không được trùng lặp với Barcode đã có trong hệ thống.</p>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Product Code (Mã sản phẩm nội bộ) *</label>
          <input type="text" id="modalProductCode" required placeholder="Ví dụ: 2C01A381AR666-01" 
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white font-mono font-semibold text-indigo-900 focus:ring-1 focus:ring-indigo-500">
          <p class="text-[11px] text-slate-400 mt-0.5">Không được trùng lặp với Product Code đã có trong hệ thống.</p>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Product Name (Tên sản phẩm chuẩn Master) *</label>
          <textarea id="modalProductName" required rows="2" placeholder="Ví dụ: Son Kem Lì Mịn Mượt COLORKEY airy velvet lip lacquer R666# 2.5g" 
            class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white font-medium focus:ring-1 focus:ring-indigo-500"></textarea>
        </div>

        <div>
          <label class="block font-medium text-slate-700 mb-1">Trạng thái kinh doanh (Status) *</label>
          <select id="modalProductStatus" class="w-full border border-slate-300 rounded-lg px-3 py-2 bg-white font-semibold focus:ring-1 focus:ring-indigo-500">
            <option value="ON">ON - Đang kinh doanh (Tự động duyệt khi bóc tách)</option>
            <option value="OFF">OFF - Ngừng kinh doanh (Cảnh báo khi bóc tách)</option>
          </select>
        </div>

        <div id="modalAlertMsg" class="hidden p-2.5 rounded-lg bg-rose-50 border border-rose-200 text-rose-700 text-xs font-medium"></div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeProductModal()" class="px-3.5 py-2 border border-slate-300 hover:bg-slate-100 text-slate-700 rounded-lg font-medium transition cursor-pointer">Hủy</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold flex items-center gap-1.5 transition cursor-pointer">
            <i data-lucide="check" class="w-4 h-4"></i> Lưu Sản Phẩm
          </button>
        </div>
      </form>
    </div>
  </div>
